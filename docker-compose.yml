services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    env_file: .env
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER} -d ${DB_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api-backend:latest
    container_name: tsa_backend
    command: gunicorn tsa_app.wsgi:application --bind 0.0.0.0:8000 --workers 4
    restart: unless-stopped
    env_file: .env
    ports:
      - '8020:8000'
    networks:
      - tsa-network
    volumes:
      - staticfiles_data:/app/src/staticfiles
      - media_data:/app/src/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  staticfiles_data:
  media_data:
networks:
  tsa-network:
    driver: bridge
